<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
    <div>
        <span style="font-size:12px;color:#64748b;margin-right:6px">Scheme:</span>
        <jqxButton (onClick)="setScheme('light')" [height]="28" style="margin-right:6px">Light</jqxButton>
        <jqxButton (onClick)="setScheme('dark')" [height]="28">Dark</jqxButton>
    </div>
    <div>
        <span style="font-size:12px;color:#64748b;margin-right:6px">Accent:</span>
        <button *ngFor="let a of accents" (click)="setAccent(a)"
                [style.background]="a"
                style="width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #e2e8f0;cursor:pointer;margin-right:6px;vertical-align:middle"></button>
    </div>
</div>

<jqxChat [width]="440" [height]="580" [title]="'Themed Assistant'" [botName]="'Nova'"
         [colorScheme]="scheme" [accentColor]="accent" [messages]="messages"
         [welcomeMessage]="'Pick a **color scheme** and an **accent color** above - I restyle instantly.'"
         [starterPrompts]="prompts" [sendRequest]="sendRequest">
</jqxChat>

<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
    <jqxButton (onClick)="classify()" [disabled]="busy" [height]="34">Categorize price with AI</jqxButton>
    <span style="font-size:12px;color:#64748b">
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#64748b;margin:0 4px 0 8px"></span>Low
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#4f46e5;margin:0 4px 0 12px"></span>Medium
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#16a34a;margin:0 4px 0 12px"></span>High
    </span>
</div>

<div *ngIf="note" style="margin-bottom:12px;color:#166534;font-size:13px;font-weight:600">{{ note }}</div>

<jqxGrid #grid [width]="'100%'" [height]="380" [source]="dataAdapter" [columns]="columns"
         [sortable]="true" [pageable]="true">
</jqxGrid>
